[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bambuddy-mcpserver"
version = "0.1.0"
description = "MCP server for Bambu Lab printers via BambuConnect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.scripts]
bambuddy-mcp = "bambuddy_mcpserver.server:main"
